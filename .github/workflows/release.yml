name: release

# Builds the standalone app (no Python needed) for Windows, macOS and Linux.
# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to publish a GitHub
# release with the three zips attached; "Run workflow" builds them as artifacts only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install . pyinstaller
      - run: python packaging/build.py
      - name: smoke test the executable (one course, no window)
        shell: bash
        run: |
          mkdir smoke && cd smoke
          ../dist/vdr-racing/vdr-racing --help
          ../dist/vdr-racing/vdr-racing bench --runs 1 --workers 1 --no-save
      - uses: actions/upload-artifact@v4
        with:
          name: vdr-racing-${{ matrix.os }}
          path: dist/vdr-racing-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: zips/*.zip
          generate_release_notes: true
